<!DOCTYPE html>
<html lang="fr">
  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="https://dokeos-prod.s3.eu-west-1.amazonaws.com/upload/academie-revolte/portal/favicon/1/logo-biais.png">
<title>TP Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --forest:#660000;
    --moss:#FEE8CD;
    --bark:#4A3728;
    --paper:#EFEADC;
    --paper-dark:#DCD4BE;
    --amber:#A8703A;
    --ink:#21201C;
    --bubble-in:#FFFFFF;
    --bubble-out:#660000;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:var(--forest);
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:440px;
    height:100vh;
    height:100dvh; /* s'ajuste dynamiquement quand la barre d'adresse/recherche du navigateur mobile apparaît ou disparaît */
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  /* Header */
  .header{
    background:var(--forest);
    color:var(--paper);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .avatar{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--moss);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.1rem;
  }
  .header-txt h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    margin:0;
  }
  .header-txt span{
    font-size:0.78rem;
    color:#C9D6C4;
  }

  /* Download banner */
  .dl-banner{
    display:none;
    padding:10px 18px;
    background:var(--paper-dark);
    text-align:center;
    flex-shrink:0;
  }
  .dl-banner.show{ display:block; animation:slideDown .3s ease; }
  @keyframes slideDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .dl-banner button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:8px 16px;
    border:none;
    border-radius:20px;
    background:var(--amber);
    color:#fff;
    cursor:pointer;
  }
  .dl-banner button:active{ transform:scale(0.97); }

  /* Chat area */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    max-width:100%;
  }
  .msg-row.out{ justify-content:flex-end; }
  .sender-photo{
    width:60px;
    height:60px;
    background-color: white;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
  }
  .bubble{
    max-width:78%;
    padding:10px 13px;
    border-radius:16px;
    font-size:0.92rem;
    line-height:1.4;
    animation:pop .25s ease;
  }
  @keyframes pop{ from{opacity:0; transform:scale(0.96);} to{opacity:1; transform:scale(1);} }
  .bubble.in{
    background:var(--bubble-in);
    color:var(--ink);
    border-bottom-left-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .bubble.out{
    background:var(--bubble-out);
    color:#fff;
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .bubble.out img, .bubble.in img{
    display:block;
    max-width:100%;
    border-radius:10px;
    margin-top:2px;
  }
  .bubble .time{
    display:block;
    font-size:0.68rem;
    opacity:0.6;
    margin-top:4px;
  }

  /* Input bar */
  .input-bar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px)) 12px;
    background:var(--paper);
    border-top:1px solid var(--paper-dark);
  }
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{ transform:scale(0.94); }
  .icon-btn svg{ width:19px; height:19px; }

  .text-field{
    flex:1;
    border:1.5px solid var(--paper-dark);
    border-radius:22px;
    padding:10px 16px;
    font-family:'Work Sans', sans-serif;
    font-size:0.92rem;
    background:#fff;
    resize:none;
    max-height:90px;
  }
  .text-field:focus{ outline:2px solid var(--amber); }

  .send-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:disabled{ opacity:0.35; cursor:default; }
  .send-btn svg{ width:17px; height:17px; }

  input[type="file"]{ display:none; }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <div class="avatar">⚡</div>
    <div class="header-txt">
      <h1>Académie Revolte</h1>
      <span>TP Fonctionnement VE VH</span>
    </div>
  </div>

  <div class="dl-banner" id="dl-banner">
    <button onclick="downloadPdf()">Télécharger vos observations (pdf)</button>
  </div>

  <div class="chat" id="chat">
    <div class="msg-row in">
      <img class="sender-photo" src="https://dokeos-prod.s3.eu-west-1.amazonaws.com/upload/academie-revolte/cropped_image/271355/-logo-jack-fullColor-cmyk_copie_2__1_.png" alt="Jack">
      <div class="bubble in">
        Pour cette activité à l'atelier, prenez en photos les principaux composants d'un véhicule électrique. Notez leur nom, leur rôle, les points de contrôle durant la révision, bref : tout ce qui semble utile à conserver !
        <span class="time" id="start-time"></span>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button class="icon-btn" id="camera-btn" title="Prendre une photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
    <input type="file" accept="image/*" capture="environment" id="photo-input">
    <textarea class="text-field" id="text-input" rows="1" placeholder="Écrire une note…"></textarea>
    <button class="send-btn" id="send-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
const chat = document.getElementById('chat');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const photoInput = document.getElementById('photo-input');
const cameraBtn = document.getElementById('camera-btn');
const dlBanner = document.getElementById('dl-banner');

let entries = [];
let firstSent = false;

document.getElementById('start-time').textContent = nowTime();

function nowTime(){
  return new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

textInput.addEventListener('input', () => {
  sendBtn.disabled = textInput.value.trim().length === 0;
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 90) + 'px';
});

textInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if(!sendBtn.disabled) sendText();
  }
});

sendBtn.addEventListener('click', sendText);
cameraBtn.addEventListener('click', () => photoInput.click());

photoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    addBubble('photo', ev.target.result);
    photoInput.value = '';
  };
  reader.readAsDataURL(file);
});

function sendText(){
  const val = textInput.value.trim();
  if(!val) return;
  addBubble('text', val);
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
}

function addBubble(type, content){
  const time = nowTime();
  const div = document.createElement('div');
  div.className = 'bubble out';
  if(type === 'photo'){
    div.innerHTML = `<img src="${content}"><span class="time">${time}</span>`;
  } else {
    div.innerHTML = `${escapeHtml(content)}<span class="time">${time}</span>`;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  entries.push({type, content, time});

  if(!firstSent){
    firstSent = true;
    dlBanner.classList.add('show');
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function normalizeImageOrientation(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      // Le navigateur applique déjà la rotation EXIF à l'affichage : naturalWidth/Height
      // reflètent l'orientation correcte. En redessinant sur un canvas à cette taille,
      // on "grave" cette orientation dans les pixels, ce que jsPDF ne fait pas tout seul.
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      resolve({
        dataUrl: canvas.toDataURL('image/jpeg', 0.92),
        width: canvas.width,
        height: canvas.height
      });
    };
    img.onerror = () => resolve({ dataUrl, width: 1, height: 1 }); // repli si l'image ne charge pas
    img.src = dataUrl;
  });
}

async function downloadPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX = 18;
  const pageWidth = 210;
  const usableWidth = pageWidth - marginX*2;
  const maxImgWidth = 80;   // encombrement maximum d'une photo, en mm
  const maxImgHeight = 100;
  let y = 22;

  // Normalise chaque photo (orientation correcte + dimensions réelles) avant de composer le PDF
  const normalized = await Promise.all(
    entries.map((e) => e.type === 'photo' ? normalizeImageOrientation(e.content) : Promise.resolve(null))
  );

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(17);
  doc.setTextColor(31,59,44);
  doc.text('TP Atelier | Fonctionnement VE-VH | Académie Revolte', marginX, y);
  y += 7;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(90,90,90);
  doc.text(new Date().toLocaleDateString('fr-FR'), marginX, y);
  y += 4;
  doc.setDrawColor(220,212,190);
  doc.line(marginX, y, pageWidth - marginX, y);
  y += 8;

  doc.setFont('helvetica', 'italic');
  doc.setFontSize(11);
  doc.setTextColor(0,0,0);
  doc.text("« Pour cette activité à l'atelier, prenez en photos les principaux composants d'un véhicule électrique. ", marginX, y);
  y += 5;
  doc.text("Notez leur nom, leur rôle, les points de contrôle durant la révision, bref : tout ce qui semble utile", marginX, y);
  y += 5;
  doc.text("à conserver !  »", marginX, y);
  y += 10;

  entries.forEach((e, i) => {
    if(y > 260) { doc.addPage(); y = 22; }
    if(e.type === 'text'){
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(33,32,28);
      const lines = doc.splitTextToSize(e.content, usableWidth);
      doc.text(lines, marginX, y);
      y += lines.length * 6 + 4;
    } else {
      // Ajuste la photo dans un encombrement maximum tout en gardant son ratio d'origine
      const norm = normalized[i] || { dataUrl: e.content, width: 1, height: 1 };
      const ratio = norm.width / norm.height;
      let imgWidth = maxImgWidth;
      let imgHeight = imgWidth / ratio;
      if(imgHeight > maxImgHeight){
        imgHeight = maxImgHeight;
        imgWidth = imgHeight * ratio;
      }
 
      if(y + imgHeight > 275){ doc.addPage(); y = 22; }
      doc.addImage(norm.dataUrl, 'JPEG', marginX, y, imgWidth, imgHeight);
      y += imgHeight + 6;
    }
    doc.setFontSize(8);
    doc.setTextColor(150,150,150);
    doc.text(e.time, marginX, y);
    y += 6;
  });

  doc.save('tp-fonctionnementVEVH.pdf');
}
</script>

</body>
</html>
